name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny
      - run: pnpm --dir web install --frozen-lockfile
      - name: Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Gate
        run: just ci
      - name: Keep the release binary
        uses: actions/upload-artifact@v4
        with:
          name: dandelion
          path: target/release/dandelion
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dandelion
          path: dist
      - name: Package
        run: |
          mv dist/dandelion "dist/dandelion-${GITHUB_REF_NAME}-linux-x86_64"
          cd dist && sha256sum ./* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
