# cargo-deny: license, advisory, and source policy for all Rust dependencies.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071 (rsa, Marvin timing attack) is about private-key
  # operations. webauthn-rs-core imports only RS256PublicKey / RS256VerifyingKey
  # to check WebAuthn signatures; this process never holds an RSA private key.
  # The resolved 0.10.0-rc.19 already contains the constant-time rewrite, but
  # the advisory clears only a stable 0.10.0. web-push also pulls rsa 0.9.10
  # through superboring -> jwt-simple, which signs the VAPID JWT with ES256
  # only, so no RSA private-key operation runs there either. Revisit when
  # webauthn-rs or web-push updates.
  "RUSTSEC-2023-0071",
  # RUSTSEC-2026-0543 (chrono unmaintained). web-push uses chrono only to
  # format VAPID JWT timestamps; no untrusted date is parsed in this process.
  # Revisit when web-push moves off chrono.
  "RUSTSEC-2026-0543",
  # RUSTSEC-2026-0387 (crypto-bigint 0.5 timing). Reachable only through
  # jwt-simple's ES256 signing of Dandelion's VAPID JWT with Dandelion's own
  # key; the attack needs local timing observation, and the key only
  # authorizes push messages. web-push pins elliptic-curve 0.13, so no
  # upgrade exists; revisit when web-push updates.
  "RUSTSEC-2026-0387",
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "CC0-1.0"]
private = { ignore = true }
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
