# Git hooks. Installed by `just setup`. Fast checks only; `just ci` is the full gate.
pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    web-format:
      root: "web/"
      glob: "*.{ts,tsx,css,json,md,html}"
      run: pnpm exec prettier --check {staged_files}
    web-lint:
      root: "web/"
      glob: "*.{ts,tsx}"
      run: pnpm exec oxlint --deny-warnings --no-error-on-unmatched-pattern {staged_files}

commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,72}$' \
          || { echo "Commit subject must follow Conventional Commits: type(scope): summary"; exit 1; }
