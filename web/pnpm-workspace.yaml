# Force the patched minimatch (Dependabot alert 2); both parents use the same
# API and the versions they ship already depend on minimatch 11.
overrides:
  minimatch: ^11.0.1

allowBuilds:
  # esbuild verifies its platform binary on install (used by Vite and Storybook).
  esbuild: true
  # Git hooks are installed explicitly by `just setup`.
  lefthook: false
